[workspace]
resolver = "3"
members = [
    "crates/operator-architecture-tests",
    "crates/operator-shared-application",
    "crates/operator-shared-contract",
    "crates/operator-shared-domain",
    "crates/operator-shared-infra",
    "crates/operator-synthetic-application",
    "crates/operator-synthetic-domain",
    "crates/operator-synthetic-infra",
    "crates/operator-evaluation-application",
    "crates/operator-evaluation-domain",
    "crates/operator-replay-application",
    "crates/operator-replay-domain",
    "crates/operator-replay-infra",
    "crates/operator-training-domain",
    "crates/operator-training-application",
    "crates/operator-training-infra",
    "crates/operator-evaluation-infra",
    "crates/operator-training-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"
license = "Apache-2.0"
description = "Operator: a small specialist runtime and dataset model for bounded KMP/MCP action policy"
repository = "https://github.com/underpass-ai/underpass-kmp-operator-trainer"

[workspace.dependencies]
operator-shared-contract = { path = "crates/operator-shared-contract" }
operator-shared-domain = { path = "crates/operator-shared-domain" }
operator-shared-application = { path = "crates/operator-shared-application" }
operator-shared-infra = { path = "crates/operator-shared-infra" }
operator-synthetic-domain = { path = "crates/operator-synthetic-domain" }
operator-synthetic-application = { path = "crates/operator-synthetic-application" }
operator-synthetic-infra = { path = "crates/operator-synthetic-infra" }
operator-evaluation-domain = { path = "crates/operator-evaluation-domain" }
operator-evaluation-application = { path = "crates/operator-evaluation-application" }
operator-replay-application = { path = "crates/operator-replay-application" }
operator-replay-domain = { path = "crates/operator-replay-domain" }
operator-replay-infra = { path = "crates/operator-replay-infra" }
operator-training-domain = { path = "crates/operator-training-domain" }
operator-training-application = { path = "crates/operator-training-application" }
operator-training-infra = { path = "crates/operator-training-infra" }
operator-evaluation-infra = { path = "crates/operator-evaluation-infra" }
operator-training-cli = { path = "crates/operator-training-cli" }

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
sha2 = "0.10"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
module_inception = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
