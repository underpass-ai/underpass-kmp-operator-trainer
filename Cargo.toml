[workspace]
resolver = "3"
members = [
    "crates/operator-architecture-tests",
    "crates/operator-shared-application",
    "crates/operator-shared-contract",
    "crates/operator-shared-domain",
    "crates/operator-shared-infra",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"
license = "Apache-2.0"
description = "Operator: a small specialist runtime and dataset model for bounded KMP/MCP action policy"
repository = "https://github.com/underpass-ai/underpass-kmp-operator-trainer"

[workspace.dependencies]
operator-shared-contract = { path = "crates/operator-shared-contract" }
operator-shared-domain = { path = "crates/operator-shared-domain" }
operator-shared-application = { path = "crates/operator-shared-application" }
operator-shared-infra = { path = "crates/operator-shared-infra" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
module_inception = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
