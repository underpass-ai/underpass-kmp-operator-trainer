# Operator: Qwen 0.5B + LoRA DPO training job.
#
# This template continues from a trained SFT LoRA adapter and optimizes it
# against chosen/rejected operator action pairs generated by
# operator-dpo-pair-generator. Defaults target the v8.1.2 artifacts; callers
# can edit the shell defaults below for later runs.

apiVersion: batch/v1
kind: Job
metadata:
  name: operator-qwen05-lora-dpo-train
  labels:
    app.kubernetes.io/name: operator-qwen05-lora-dpo-train
    app.kubernetes.io/part-of: underpass-operator
    operator.training/parallelism: ddp-4gpu
    operator.training/stage: dpo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-qwen05-lora-dpo-train
        operator.training/parallelism: ddp-4gpu
        operator.training/stage: dpo
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: docker.io/pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/repo
          env:
            - name: HF_HOME
              value: /host-tmp/huggingface
            - name: TRANSFORMERS_CACHE
              value: /host-tmp/huggingface/transformers
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
          command:
            - bash
            - -lc
          args:
            - |
              set -euo pipefail
              : "${BASE_ADAPTER_DIR:=/host-tmp/operator-qwen05-lora-v8.1.2-sft-v2}"
              : "${DPO_PAIRS_JSONL:=/host-tmp/operator-dpo-pairs-v8.1.2/pairs.jsonl}"
              : "${OUTPUT_DIR:=/host-tmp/operator-qwen05-lora-v8.1.2-dpo}"
              : "${MODEL_ID:=Qwen/Qwen2.5-0.5B-Instruct}"

              python scripts/operator/train_operator_dpo_lora.py \
                --base-adapter-dir "${BASE_ADAPTER_DIR}" \
                --pairs-jsonl "${DPO_PAIRS_JSONL}" \
                --model-id "${MODEL_ID}" \
                --output-dir "${OUTPUT_DIR}-validate-only" \
                --validate-only

              python -m pip install --upgrade pip
              python -m pip install \
                "transformers>=4.51.0" \
                "datasets>=3.6.0" \
                "peft>=0.15.0" \
                "accelerate>=1.7.0" \
                "trl>=0.18.0" \
                tensorboard \
                sentencepiece

              rm -rf "${OUTPUT_DIR}"
              mkdir -p "${OUTPUT_DIR}"
              torchrun --standalone --nproc_per_node=4 scripts/operator/train_operator_dpo_lora.py \
                --base-adapter-dir "${BASE_ADAPTER_DIR}" \
                --pairs-jsonl "${DPO_PAIRS_JSONL}" \
                --model-id "${MODEL_ID}" \
                --output-dir "${OUTPUT_DIR}" \
                --learning-rate 5e-6 \
                --beta 0.1 \
                --epochs 2 \
                --batch-size 2 \
                --grad-accum 4 \
                --max-length 4096 \
                --max-prompt-length 3072 \
                --device-map none \
                --bf16 \
                2>&1 | tee "${OUTPUT_DIR}/training.log"
          resources:
            limits:
              nvidia.com/gpu: "4"
              memory: 96Gi
            requests:
              nvidia.com/gpu: "4"
              cpu: "12"
              memory: 64Gi
          volumeMounts:
            - name: repo
              mountPath: /workspace/repo
            - name: host-tmp
              mountPath: /host-tmp
      volumes:
        - name: repo
          hostPath:
            path: /home/tirso/ai/developents/operator
            type: Directory
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
