# Operator: Qwen 0.5B + LoRA SFT training job.
#
# Adapted from rehydration-kernel/k8s/kernel-operator-qwen05-lora-v5-job.yaml.
# This template trains the operator policy via the canonical Python
# pipeline at operator/scripts/operator/train_operator_sft_lora.py;
# see ../docs/training/runbook.md for the end-to-end flow.
#
# Inputs (host paths, mounted into the pod):
#   /host-tmp/<dataset_dir>/openai_train.jsonl
#   /host-tmp/<dataset_dir>/openai_eval.jsonl
# Output:
#   /host-tmp/<output_dir>/   <- LoRA adapter weights
#
# Adjust:
#   - args.* for the dataset paths and hyperparameters
#   - resources.* for the local GPU / CPU / memory
#   - volumes.repo.hostPath to point at the operator repo
#
# Defaults remain generic. The caller chooses versioned dataset/output
# paths by setting DATASET_DIR and OUTPUT_DIR before applying the Job.

apiVersion: batch/v1
kind: Job
metadata:
  name: operator-qwen05-lora-train
  labels:
    app.kubernetes.io/name: operator-qwen05-lora-train
    app.kubernetes.io/part-of: underpass-operator
    operator.training/parallelism: ddp-4gpu
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-qwen05-lora-train
        operator.training/parallelism: ddp-4gpu
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: docker.io/pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/repo
          env:
            - name: HF_HOME
              value: /host-tmp/huggingface
            - name: TRANSFORMERS_CACHE
              value: /host-tmp/huggingface/transformers
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
          command:
            - bash
            - -lc
          args:
            - |
              set -euo pipefail
              # Fail fast on dataset/path issues before spending time on deps/model load.
              : "${DATASET_DIR:=/host-tmp/operator-sft}"
              : "${OUTPUT_DIR:=/host-tmp/operator-qwen05-lora}"
              : "${MODEL_ID:=Qwen/Qwen2.5-0.5B-Instruct}"
              python scripts/operator/train_operator_sft_lora.py \
                --train-jsonl "${DATASET_DIR}/openai_train.jsonl" \
                --eval-jsonl  "${DATASET_DIR}/openai_eval.jsonl" \
                --output-dir "${OUTPUT_DIR}-validate-only" \
                --validate-only

              python -m pip install --upgrade pip
              python -m pip install \
                "transformers>=4.51.0" \
                "datasets>=3.6.0" \
                "peft>=0.15.0" \
                "accelerate>=1.7.0" \
                "trl>=0.18.0" \
                sentencepiece
              rm -rf "${OUTPUT_DIR}"
              torchrun --standalone --nproc_per_node=4 scripts/operator/train_operator_sft_lora.py \
                --train-jsonl "${DATASET_DIR}/openai_train.jsonl" \
                --eval-jsonl  "${DATASET_DIR}/openai_eval.jsonl" \
                --model-id "${MODEL_ID}" \
                --output-dir "${OUTPUT_DIR}" \
                --learning-rate 2e-4 \
                --lora-r 16 \
                --lora-alpha 32 \
                --lora-target-modules "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj" \
                --epochs 3 \
                --batch-size 4 \
                --grad-accum 1 \
                --max-length 2048 \
                --device-map none \
                --bf16
          resources:
            limits:
              nvidia.com/gpu: "4"
              memory: 96Gi
            requests:
              nvidia.com/gpu: "4"
              cpu: "12"
              memory: 64Gi
          volumeMounts:
            - name: repo
              mountPath: /workspace/repo
            - name: host-tmp
              mountPath: /host-tmp
      volumes:
        - name: repo
          hostPath:
            path: /home/tirso/ai/developents/operator
            type: Directory
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
